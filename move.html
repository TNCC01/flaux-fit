<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1514">
<title>Movements · FIT</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #050a0a; --stage: #0a1514; --card: #0f1c1c; --border: #1f3333;
    --text: #f0fdfa; --muted: #94a3b8; --teal: #2dd4bf; --rose: #f43f5e; --amber: #fb923c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
  a { color: var(--teal); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
  header.top { display: flex; align-items: center; gap: 12px; padding: 14px 16px 6px; max-width: 880px; margin: 0 auto; }
  header.top a { text-decoration: none; font-weight: 600; font-size: 0.95rem; }
  header.top .spacer { flex: 1; }

  h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); margin: 4px 0 2px; letter-spacing: -0.01em; text-wrap: balance; }
  .cue { color: var(--muted); margin: 0 0 12px; font-weight: 600; }

  .stageWrap { position: relative; border-radius: 16px; overflow: hidden; background: var(--stage);
    border: 1px solid var(--border); }
  #stage { display: block; width: 100%; height: min(62vh, 560px); touch-action: none; }
  #phaseLabel { position: absolute; left: 14px; top: 12px; font-weight: 700; font-size: 1.05rem;
    text-shadow: 0 1px 6px #000; pointer-events: none; }
  .hint { position: absolute; right: 14px; top: 13px; color: var(--muted); font-size: 0.78rem; pointer-events: none; }
  .controls { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 8px;
    flex-wrap: wrap; align-items: center; }
  .controls .spacer { flex: 1; }
  .pill { background: rgba(10, 21, 20, 0.82); border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 14px; font-weight: 700; cursor: pointer; backdrop-filter: blur(6px); min-width: 64px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: rgba(10, 21, 20, 0.82); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px; font-size: 0.85rem; cursor: pointer; backdrop-filter: blur(6px); }
  .chip.on { border-color: var(--teal); color: var(--teal); }
  #phases { margin: 12px 0 4px; }
  #phases .chip { background: var(--card); }

  section { margin: 22px 0; }
  section h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted);
    margin: 0 0 8px; }
  section .body { line-height: 1.55; font-size: 1rem; max-width: 64ch; }
  section ul, section ol { margin: 0; padding-left: 1.2em; }
  section li { margin: 4px 0; }
  #secMistakes li::marker { color: var(--rose); }
  .muscle { display: inline-block; border-radius: 999px; padding: 5px 12px; margin: 0 6px 6px 0; font-size: 0.85rem;
    font-weight: 600; border: 1px solid; }
  .muscle.primary { color: #fda4af; border-color: rgba(244, 63, 94, 0.6); background: rgba(244, 63, 94, 0.12); }
  .muscle.secondary { color: #fdba74; border-color: rgba(251, 146, 60, 0.5); background: rgba(251, 146, 60, 0.1); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  dt { color: var(--muted); font-weight: 600; }
  dd { margin: 0; }
  .note { color: var(--muted); font-size: 0.85rem; line-height: 1.5; border-top: 1px solid var(--border);
    padding-top: 14px; margin-bottom: 32px; }

  /* library */
  #library h1 { margin-top: 12px; }
  #libraryCount { color: var(--muted); margin: 0 0 8px; }
  #library h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 24px 0 8px; }
  ul.lib { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  ul.lib a { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; text-decoration: none; color: var(--text); font-weight: 600; }
  ul.lib a:hover { border-color: var(--teal); }

  /* check mode */
  #checkSheet { padding: 8px; }
  #checkSheet h3 { margin: 12px 0 4px; font-size: 14px; }
  .checkRow { display: flex; flex-wrap: wrap; gap: 6px; }
  .checkRow figure { margin: 0; background: #000; }
  .checkRow img { display: inline-block; }
  .checkRow figcaption { font-size: 11px; color: var(--muted); padding: 2px 4px; }
  body.checking header.top, body.checking #detail, body.checking #library { display: none; }
  body.embed header.top { display: none; }
  body.embed #detail { padding-top: 14px; }
  body.embed h1, body.embed .cue { padding-right: 96px; }

  @media (max-width: 560px) {
    #stage { height: 56vh; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <a id="backLink" href="move.html#">&larr; All movements</a>
</header>

<main id="detail" class="wrap" hidden>
  <h1 id="moveName"></h1>
  <p class="cue" id="moveCue"></p>
  <div class="stageWrap">
    <canvas id="stage" aria-label="3D demonstration of the movement. Drag to turn it."></canvas>
    <div id="phaseLabel"></div>
    <div class="hint">Drag to turn</div>
    <div class="controls">
      <button class="pill" id="play">Pause</button>
      <button class="pill" id="speed" aria-label="Playback speed">1x</button>
      <span class="spacer"></span>
      <div class="chips" id="views" aria-label="Camera angle"></div>
    </div>
  </div>
  <div class="chips" id="phases" aria-label="Jump to a position"></div>

  <section id="secMuscles"><h2>Working</h2><div class="body" id="muscles"></div></section>
  <section id="secSetup"><h2>Set up</h2><div class="body"></div></section>
  <section id="secSteps"><h2>How to do it</h2><div class="body"></div></section>
  <section id="secCues"><h2>Coaching cues</h2><div class="body"></div></section>
  <section id="secMistakes"><h2>Common mistakes</h2><div class="body"></div></section>
  <section id="secFacts"><h2>Good to know</h2><div class="body"><dl id="facts"></dl></div></section>
  <p class="note">General guidance from common coaching practice, not medical advice. If something hurts, stop and
    check with a physio or doctor.</p>
</main>

<main id="library" class="wrap" hidden>
  <h1>Movements</h1>
  <p id="libraryCount"></p>
  <div id="libraryList"></div>
</main>

<div id="checkSheet" hidden></div>

<script src="js/exercises.js"></script>
<script type="module" src="js/move/viewer.js"></script>
</body>
</html>
